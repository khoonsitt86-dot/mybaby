<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fce4ec;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      padding: 20px;
    }

    h1 {
      color: #d81b60;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p.instruction {
      color: #880e4f;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    /* Cake & Candle Style */
    .cake-container {
      position: relative;
      width: 150px;
      height: 120px;
      margin: 0 auto;
      cursor: pointer;
    }

    .cake {
      position: absolute;
      bottom: 0;
      width: 150px;
      height: 80px;
      background: #f48fb1;
      border-radius: 10px 10px 0 0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .cake::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 0;
      width: 150px;
      height: 20px;
      background: #f06292;
      border-radius: 10px;
    }

    .candle {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 40px;
      background: #ffeb3b;
      border-radius: 3px;
      z-index: 2;
    }

    .flame {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 20px;
      background: #ff9800;
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 10px #ff9800, 0 0 20px #ff5722;
      animation: flicker 0.6s infinite alternate;
    }

    .flame.off {
      display: none;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.1); }
    }

    /* Pop-up Card Style */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      z-index: 10;
    }

    .card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 85%;
      max-width: 380px;
      opacity: 0;
      transition: all 0.5s ease;
      z-index: 11;
      pointer-events: none;
    }

    .card.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .card img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .card h2 {
      color: #e91e63;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    .card p {
      color: #555;
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Happy Birthday! 🎂</h1>
    <p class="instruction">မီးဖယောင်းတိုင်လေးကို နှိပ်ပြီး မီးငြိမ်းလိုက်ပါ (သို့) မှုတ်လိုက်ပါ</p>

    <div class="cake-container" id="cakeContainer">
      <div class="candle">
        <div class="flame" id="flame"></div>
      </div>
      <div class="cake"></div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- ကောင်မလေးပုံနဲ့ စာသား Card -->
  <div class="card" id="birthdayCard">
    <img src="https://i.ibb.co/b5tGSSTT/image.jpg" alt="Birthday Girl" id="girlPhoto">
    <h2>Happy Birthday My Love! ❤️</h2>
    <p>မွေးနေ့မှာ လိုအင်ဆန္ဒတွေအားလုံး ပြည့်ဝပါစေ။ အမြဲတမ်း ပြုံးပြုံးရွှင်ရွှင်နဲ့ ပျော်ရွှင်ပါစေနော်။</p>
  </div>

  <script>
    const flame = document.getElementById('flame');
    const cakeContainer = document.getElementById('cakeContainer');
    const card = document.getElementById('birthdayCard');
    const overlay = document.getElementById('overlay');

    // မီးဖယောင်းတိုင် ငြိမ်းသွားချိန်လုပ်ဆောင်မည့် Function
    function extinguishCandle() {
      if (!flame.classList.contains('off')) {
        flame.classList.add('off');

        // မီးငြိမ်းပြီး ၁ စက္ကန့်အကြာမှာ ပုံနဲ့ Card ပေါ်လာမည်
        setTimeout(() => {
          overlay.classList.add('show');
          card.classList.add('show');
        }, 800);
      }
    }

    cakeContainer.addEventListener('click', extinguishCandle);
  </script>

</body>
</html>
